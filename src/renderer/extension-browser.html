<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'"><title>扩展浏览</title><style>body{margin:0;background:#f4f6fa;color:#202634;font:13px system-ui}header{height:48px;display:flex;align-items:center;gap:5px;padding:0 8px;box-sizing:border-box}button{border:1px solid #d4dae5;background:white;border-radius:5px;height:30px;cursor:pointer}#tabs{display:flex;gap:4px;min-width:60px;max-width:45%;overflow:auto}#tabs button{white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}#tabs button.active{background:#e7ebff;border-color:#656ee3}form{display:flex;flex:1;min-width:80px}input{width:100%;border:1px solid #d4dae5;border-radius:6px;height:28px;padding:0 8px}#error{color:#a42e3a;position:absolute;top:52px;background:white;z-index:2}</style></head><body><header><button data-nav="back" aria-label="后退">←</button><button data-nav="forward" aria-label="前进">→</button><button data-nav="reload" aria-label="刷新">↻</button><div id="tabs"></div><form><input id="url" aria-label="网址" placeholder="输入网址"></form><button data-nav="close" aria-label="关闭当前标签">×</button></header><span id="error" role="alert"></span><script src="extension-browser.js"></script></body></html>
